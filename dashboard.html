<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>TIGER-X | DASHBOARD</title>
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; font-family: sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); padding: 40px; border-radius: 20px; text-align: center; color: white; width: 80%; max-width: 500px; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; }
        .stat-box { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); }
        .back-btn { display: inline-block; margin-top: 20px; color: white; text-decoration: none; border: 1px solid white; padding: 10px 20px; border-radius: 10px; transition: 0.3s; }
        .back-btn:hover { background: white; color: #764ba2; }
    </style>
</head>
<body>
    <div class="glass">
        <h1>ANALYTICS</h1>
        <div class="stat-grid">
            <div class="stat-box"><h4>CPU</h4><p>15%</p></div>
            <div class="stat-box"><h4>MEMORY</h4><p>42%</p></div>
            <div class="stat-box"><h4>STATUS</h4><p style="color: #00ff00;">Online</p></div>
            <div class="stat-box"><h4>UPLINK</h4><p>Active</p></div>
        </div>
        <a href="index.html" class="back-btn">← BACK HOME</a>
    </div>
</body>
</html>
