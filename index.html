<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>TIGER EMPIRE | CONTROL</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 20px; }
        .box { border: 1px solid #0f0; padding: 20px; border-radius: 5px; }
        h1 { border-bottom: 2px solid #0f0; padding-bottom: 10px; }
    </style>
</head>
<body>
    <h1>TIGER EMPIRE - CORE SYSTEM</h1>
    <div class="grid">
        <div class="box">1-10: بوتات أتمتة</div>
        <div class="box">11-20: تصميم وجرافيك</div>
        <div class="box">21-30: حماية وأمن</div>
        <div class="box">31-40: إدارة ومحاسبة</div>
    </div>
</body>
</html>
