<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --neon: #00ff41; --gold: #ffd700; --dark: #050505; }
        body { margin: 0; background: var(--dark); color: white; font-family: 'Orbitron', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        #matrix-bg { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.1; }

        .nav-sidebar { width: 70px; border-right: 1px solid rgba(0, 255, 65, 0.1); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 35px; background: rgba(0,0,0,0.8); }
        .nav-sidebar a { color: var(--neon); font-size: 1.4rem; transition: 0.3s; }
        .nav-sidebar a:hover { color: var(--gold); transform: scale(1.2); }

        .content { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-left: 8%; position: relative; }
        
        .hero-title { font-size: 5.5rem; letter-spacing: 12px; margin: 0; font-weight: 900; text-transform: uppercase; line-height: 0.9; }
        .hero-title span { color: var(--gold); text-shadow: 0 0 40px rgba(255, 215, 0, 0.3); }
        
        .sub-text { margin-top: 25px; font-size: 1.1rem; color: #666; letter-spacing: 3px; border-left: 2px solid var(--neon); padding-left: 15px; }

        .btn-group { margin-top: 50px; display: flex; gap: 20px; }
        .main-btn { padding: 18px 45px; border: 1px solid var(--neon); color: var(--neon); text-decoration: none; font-size: 0.9rem; letter-spacing: 3px; font-weight: bold; transition: 0.5s; }
        .main-btn:hover { background: var(--neon); color: black; box-shadow: 0 0 50px var(--neon); }

        .signature { position: fixed; bottom: 30px; right: 40px; font-size: 0.6rem; color: #222; letter-spacing: 4px; }
    </style>
</head>
<body>
    <canvas id="matrix-bg"></canvas>

    <div class="nav-sidebar">
        <a href="https://wa.me/201017417084" target="_blank"><i class="fab fa-whatsapp"></i></a>

        <a href="https://github.com/mido3657tiger-ux" target="_blank"><i class="fab fa-github"></i></a>
    </div>

    <div class="content">
        <h1 class="hero-title">TIGER<br><span>ABU ALI</span></h1>
        <div class="sub-text">
            SYSTEM ARCHITECT // CYBER SECURITY // FREELANCE DEVELOPER
        </div>
        
        <div class="btn-group">
            <a href="projects.html" class="main-btn">VIEW PROJECTS</a>
            <a href="dashboard.html" class="main-btn">CORE ACCESS</a>
        </div>
    </div>

    <div class="signature">© 2026 AUTHORIZED ACCESS ONLY // M.MEL TIGER</div>

    <script>
        const canvas = document.getElementById('matrix-bg');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const chars = "01";
        const drops = Array(Math.floor(canvas.width / 20)).fill(1);
        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0f0";
            drops.forEach((y, i) => {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * 20, y * 20);
                if (y * 20 > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(draw, 33);
    </script>
</body>
