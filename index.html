<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiger-Core | أنظمة الأتمتة الذكية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
            background: #1a1a1a;
            border: 2px solid #ff6a00;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 0 25px rgba(255, 106, 0, 0.2);
        }
        h1 {
            color: #ff6a00;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 106, 0, 0.5);
        }
        p {
            color: #cccccc;
            margin-bottom: 25px;
            font-size: 1.1rem;
        }
        .services {
            margin-bottom: 30px;
            text-align: right;
        }
        .service-item {
            background: #262626;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-right: 4px solid #ee0979;
        }
        .service-item h3 {
            font-size: 1.2rem;
            color: #ffffff;
        }
        .service-item span {
            color: #ff6a00;
            font-weight: bold;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            text-align: center;
        }
        .btn-bot {
            background: linear-gradient(45deg, #ff6a00, #ee0979);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 106, 0, 0.4);
        }
        .btn-bot:hover {
            box-shadow: 0 6px 20px rgba(255, 106, 0, 0.7);
            transform: translateY(-2px);
        }
        .btn-wa {
            background-color: #25d366;
            color: white;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
        }
        .btn-wa:hover {
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.6);
            transform: translateY(-2px);
        }
        .btn-tg {
            background-color: #0088cc;
            color: white;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.3);
        }
        .btn-tg:hover {
            box-shadow: 0 6px 20px rgba(0, 136, 204, 0.6);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>TIGER-CORE</h1>
    <p>بوابتك لتطوير أنظمة الأتمتة وبوتات التليجرام الاحترافية وسكربتات الحماية</p>
    
    <div class="services">
        <div class="service-item">
            <h3>🤖 بوت أتمتة تليجرام كامل ومربوط بكاش</h3>
            <span>السعر: 500 جنيه مصري</span>
        </div>
        <div class="service-item">
            <h3>🛡️ سكربت فحص وحماية المواقع من الثغرات</h3>
            <span>السعر: 800 جنيه مصري</span>
        </div>
    </div>

    <div class="btn-container">
        <a href="https://t.me/My_TigerSystem_Bot" target="_blank" class="btn btn-bot">🤖 افتح تجربة البوت الآلي مجاناً</a>
        <a href="https://wa.me/201098113657?text=أريد%20شراء%20سيستم%20تايجر" target="_blank" class="btn btn-wa">🟢 تواصل عبر واتساب كاش</a>
        <a href="https://t.me/mido3657tiger" target="_blank" class="btn btn-tg">💬 تواصل عبر تليجرام المطور</a>
    </div>
</div>

</body>
</html>
