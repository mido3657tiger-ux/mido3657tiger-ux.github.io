<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TigerX Login</title>
<link rel="stylesheet" href="style.css">

<style>
.login-box {
    width: 350px;
    margin: 120px auto;
    background: #121a2e;
    padding: 30px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.08);
}

input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    background: #0e1424;
    border: 1px solid rgba(255,255,255,0.1);
    color: white;
    border-radius: 8px;
}

button {
    width: 100%;
}
</style>

</head>

<body>

<div class="login-box">
    <h2>⚡ TIGERX LOGIN</h2>

    <input type="text" id="user" placeholder="Username">
    <input type="password" id="pass" placeholder="Password">

    <button onclick="login()">Login</button>
</div>

<script>
function login() {
    const u = document.getElementById('user').value;
    const p = document.getElementById('pass').value;

    if (u === "admin" && p === "1234") {
        localStorage.setItem("token", "tigerx-auth");
        window.location.href = "/dashboard";
    } else {
        alert("Invalid credentials");
    }
}
</script>

</body>
</html>
